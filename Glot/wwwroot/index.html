<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glot</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Glot.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="minimal-loader">
            <div class="loader-circle"></div>
            <div class="loader-text">Loading</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <!-- GitHub Pages redirect handler -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get('redirect');
            if (redirect) {
                var base = document.querySelector('base').getAttribute('href');
                var targetUrl = base + redirect;
                history.replaceState(null, null, targetUrl);
            }
        })();
    </script>
    
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                return defaultUri;
            }
        });
    </script>
</body>

</html>
