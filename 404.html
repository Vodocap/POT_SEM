<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var route = path.replace(/^\/POT_SEM\//, '');
        
        if (route && route !== '' && route !== '/') {
          window.location.replace('/POT_SEM/?redirect=' + encodeURIComponent(route));
        } else {
          window.location.replace('/POT_SEM/');
        }
      })();
    </script>
</head>
<body>
    <p>⏳ Redirecting...</p>
</body>
</html>
