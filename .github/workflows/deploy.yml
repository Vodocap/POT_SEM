name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Glot/Glot.csproj
    
    - name: Build
      run: dotnet build Glot/Glot.csproj -c Release --no-restore
    
    - name: Publish
      run: dotnet publish Glot/Glot.csproj -c Release -o release --nologo
    
    - name: Create appsettings.json with Supabase secrets
      run: |
        cat > release/wwwroot/appsettings.json << EOF
        {
          "Supabase": {
            "Url": "${{ secrets.SUPABASE_URL }}",
            "AnonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
        }
        EOF
    
    - name: Change base-tag in index.html
      run: |
        sed -i 's/<base href="\/" \/>/<base href="\/POT_SEM\/" \/>/g' release/wwwroot/index.html
    
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll
    
    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html
    
    - name: Add SPA redirect script to index.html HEAD
      run: |
        sed -i '/<head>/a \
        <!-- SPA redirect hack for GitHub Pages -->\
        <script>\
          (function(l) {\
            if (l.search[1] === "/" ) {\
              var decoded = l.search.slice(1).split("&").map(function(s) { \
                return s.replace(/~and~/g, "&")\
              }).join("?");\
              window.history.replaceState(null, null,\
                  l.pathname.slice(0, -1) + decoded + l.hash\
              );\
            }\
          }(window.location))\
        </script>' release/wwwroot/index.html
    
    - name: Add redirect script to 404.html
      run: |
        sed -i '/<head>/a \
        <!-- GitHub Pages SPA redirect -->\
        <script>\
          var pathSegmentsToKeep = 1;\
          var l = window.location;\
          l.replace(\
            l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +\
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +\
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +\
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +\
            l.hash\
          );\
        </script>' release/wwwroot/404.html
    
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: release/wwwroot
        branch: gh-pages
